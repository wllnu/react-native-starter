# Deterministic checks for every pull request and every push to main.
# Runs scripts/verify.mjs in full mode: lint, typecheck, Jest, expo-doctor,
# prebuild, the native-folder and secret checks, plus a gitleaks scan.
# Actions are pinned to commit SHAs (RULES.md, "Pin CI actions to commit hashes").

name: verify

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Gitleaks and the verify gate's merge-base diff need full history.
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          # Same pnpm as eas.json so the lockfile and build environments match.
          version: 12.11.2

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # 24 is the current LTS line and satisfies Expo SDK 57's minimum of 22.13.x.
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify (full)
        run: pnpm verify --full
        env:
          CI: true

      - name: Secret scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}