# The Pro paywall sheet, opened from Settings. Verify skips this flow unless
# EXPO_PUBLIC_REVENUECAT_IOS_KEY is set, matching paywallEnabled() in src/features/pro.
appId: com.example.starter.dev
name: paywall
---
- openLink:
    link: exp+starter://expo-development-client/?url=http%3A%2F%2Flocalhost%3A8081
- runFlow:
    when:
      visible: "Open in"
    commands:
      - tapOn: "Open"
- extendedWaitUntil:
    visible: "Your notes show up here."
    timeout: 30000
- tapOn: "Settings"
- extendedWaitUntil:
    visible: "Usage and crash reports"
    timeout: 10000
- tapOn: "Get Pro"
- extendedWaitUntil:
    visible: "Subscribe to unlock Pro."
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot:
    path: shot
