allowBuilds:
  '@sentry/cli': true
  better-sqlite3: true
  esbuild: true
  unrs-resolver: true
# New package versions must be a day old before install (RULES.md, supply-chain protection).
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - '@expo/cli@57.0.32'
  - '@expo/config-plugins@57.0.11'
  - '@expo/router-server@57.0.14'
  - expo-modules-core@57.0.24
  - expo-modules-jsi@57.1.3
  - expo@57.0.31
  - '@expo/ui@57.0.26'
  - expo-router@57.0.29
permissions:
  drizzle-kit:
    build: false
    skills: false
